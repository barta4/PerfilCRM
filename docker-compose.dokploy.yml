services:
  perfil-backend:
    image: alfredobartaburu/perfilcrm-backend:v1.3
    platform: linux/amd64
    container_name: perfil-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://postgres:perfil.20262024@perfil-db:5432/perfil_crm
      GOOGLE_AI_KEY: "AIzaSyA4IjqHlspdyatoBAUKaBf0OFHqev1MzNs"
      JWT_SECRET: "QW9T3XK7VB1MDR6ZP42HN80CFY5LSJU2"
      CORS_ORIGINS: "https://perfil.urufile.duckdns.org,http://perfil.urufile.duckdns.org"
    volumes:
      - perfil_uploads_data:/app/uploads
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # Enrutamiento de la API con prioridad alta
      - "traefik.http.routers.perfil-backend.rule=Host(`perfil.urufile.duckdns.org`) && PathPrefix(`/api`)"
      - "traefik.http.routers.perfil-backend.entrypoints=web,websecure"
      - "traefik.http.routers.perfil-backend.priority=100"
      - "traefik.http.routers.perfil-backend.tls=true"
      - "traefik.http.routers.perfil-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.perfil-backend.loadbalancer.server.port=3001"
    depends_on:
      perfil-db:
        condition: service_healthy

  perfil-frontend:
    image: alfredobartaburu/perfilcrm-frontend:v1.2
    platform: linux/amd64
    container_name: perfil-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://perfil.urufile.duckdns.org
      INTERNAL_API_URL: http://perfil-backend:3001
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # Enrutamiento del Frontend
      - "traefik.http.routers.perfil-frontend.rule=Host(`perfil.urufile.duckdns.org`)"
      - "traefik.http.routers.perfil-frontend.entrypoints=web,websecure"
      - "traefik.http.routers.perfil-frontend.priority=10"
      - "traefik.http.routers.perfil-frontend.tls=true"
      - "traefik.http.routers.perfil-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.perfil-frontend.loadbalancer.server.port=3000"
    depends_on:
      - perfil-backend

  perfil-db:
    image: postgres:16-alpine
    platform: linux/amd64
    container_name: perfil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: perfil.20262024
      POSTGRES_DB: perfil_crm
    volumes:
      - perfil_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perfil_crm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

networks:
  dokploy-network:
    external: true
  default:
    driver: bridge

volumes:
  perfil_db_data:
    driver: local
  perfil_uploads_data:
    driver: local
